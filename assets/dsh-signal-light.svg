<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">DSH Usage 用量信号示意</title>
  <desc id="desc">浅色用量信号卡。左侧三段会话依次亮起，信号经虚线通路进入中间的半小时 Token 柱，扫描线扫过的柱逐段点亮；右侧显示推算费用、余额，以及无法确认价格时的明确标记。结构示意，非产品截图。</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f8fa"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#3d7be0" stop-opacity="0.6"/>
      <stop offset="0.35" stop-color="#3d7be0" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#7a68e6" stop-opacity="0"/>
      <stop offset="1" stop-color="#7a68e6" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#3d7be0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7a68e6"/>
    </linearGradient>
    <linearGradient id="sweepGlow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7a68e6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7a68e6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7a68e6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cardGlow">
      <stop stop-color="#3d7be0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3d7be0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="packetGlow">
      <stop stop-color="#7a68e6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7a68e6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.9" fill="#3d7be0" opacity="0.12"/>
    </pattern>
    <clipPath id="panelClip">
      <rect x="16" y="16" width="1168" height="288" rx="14"/>
    </clipPath>
    <clipPath id="revealClip">
      <rect class="reveal" x="372" y="104" width="366" height="140"/>
    </clipPath>
  </defs>
  <style>
    text { font-family: Arial, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .s2, .run-pulse { transform-box: fill-box; transform-origin: 50% 50%; }
    .cost { transform-box: fill-box; transform-origin: 0 50%; }
    .s1, .s2, .s3, .cost, .flag, .sweep-a, .sweep-b { opacity: 0; }
    .run-pulse { opacity: 0.5; }
    .glow { opacity: 0.08; }
    @media (prefers-reduced-motion: no-preference) {
      .reveal { animation: reveal 6.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .bright { animation: bright 6.8s ease-in-out infinite; }
      .s1 { animation: s1 6.8s ease-in-out infinite; }
      .s2 { animation: s2 6.8s ease-in-out infinite; }
      .s3 { animation: s3 6.8s ease-in-out infinite; }
      .sweep-a { animation: sweep-a 6.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .sweep-b { animation: sweep-b 6.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .cost { animation: cost 6.8s ease-in-out infinite; }
      .flag { animation: flag 6.8s ease-in-out infinite; }
      .packet-a { animation: packet 2.2s linear infinite; }
      .packet-b { animation: packet 2.2s linear infinite; animation-delay: -1.1s; }
      .glow { animation: glow 4.2s ease-in-out infinite; }
      .run-pulse { animation: run-pulse 1.7s ease-out infinite; }
      .cursor { animation: cursor 1.1s steps(1, end) infinite; }
    }
    @keyframes reveal {
      0%, 8% { transform: translateX(-366px); }
      38% { transform: translateX(-186px); }
      39% { transform: translateX(-186px); }
      74%, 100% { transform: translateX(0); }
    }
    @keyframes bright {
      0%, 96% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes s1 {
      0%, 1% { opacity: 0; }
      2%, 10% { opacity: 1; }
      11%, 100% { opacity: 0; }
    }
    @keyframes s2 {
      0%, 34% { transform: scale(1); opacity: 0; }
      36% { transform: scale(1); opacity: 0.8; }
      46% { transform: scale(2.4); opacity: 0; }
      47%, 100% { transform: scale(2.4); opacity: 0; }
    }
    @keyframes s3 {
      0%, 38% { opacity: 0; }
      40%, 64% { opacity: 1; }
      65%, 100% { opacity: 0; }
    }
    @keyframes sweep-a {
      0%, 8% { transform: translateX(0); opacity: 0; }
      9% { transform: translateX(0); opacity: 1; }
      37.5% { transform: translateX(180px); opacity: 1; }
      38%, 100% { transform: translateX(180px); opacity: 0; }
    }
    @keyframes sweep-b {
      0%, 38% { transform: translateX(0); opacity: 0; }
      39% { transform: translateX(0); opacity: 1; }
      73% { transform: translateX(186px); opacity: 1; }
      74%, 100% { transform: translateX(186px); opacity: 0; }
    }
    @keyframes cost {
      0%, 73% { opacity: 0; transform: scale(1); }
      75%, 76% { opacity: 1; transform: scale(1); }
      79%, 84% { opacity: 1; transform: scale(1.04); }
      87% { opacity: 1; transform: scale(1); }
      88%, 100% { opacity: 0; transform: scale(1); }
    }
    @keyframes flag {
      0%, 86% { opacity: 0; }
      88%, 96% { opacity: 1; }
      97%, 100% { opacity: 0; }
    }
    @keyframes packet {
      0% { transform: translateX(0); opacity: 0; }
      6% { opacity: 1; }
      46% { transform: translateX(40px); opacity: 1; }
      54%, 100% { transform: translateX(40px); opacity: 0; }
    }
    @keyframes glow {
      0%, 100% { opacity: 0.05; }
      50% { opacity: 0.24; }
    }
    @keyframes run-pulse {
      0% { transform: scale(1); opacity: 0.9; }
      70%, 100% { transform: scale(2.2); opacity: 0; }
    }
    @keyframes cursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="#edf0f4" stroke="#cbd2dc"/>
  <rect x="16" y="16" width="1168" height="288" rx="14" fill="url(#surface)" stroke="#cbd2dc"/>
  <g clip-path="url(#panelClip)">
    <rect x="16" y="16" width="1168" height="288" fill="url(#dots)"/>
  </g>
  <rect x="16.5" y="16.5" width="1167" height="287" rx="13.5" fill="none" stroke="url(#edge)" opacity="0.8"/>

  <text x="40" y="48" class="mono" fill="#2559c4" font-size="14" letter-spacing="1.6">DSH USAGE / SIGNAL SNAPSHOT</text>
  <text x="1160" y="48" class="mono" fill="#6c7583" font-size="12" letter-spacing="0.8" text-anchor="end">结构示意 · 非产品截图</text>

  <g id="sessions">
    <rect x="40" y="68" width="270" height="194" rx="10" fill="#ffffff" stroke="#d5dbe4"/>
    <text x="58" y="90" class="mono" fill="#6c7583" font-size="11" letter-spacing="1.2">SESSIONS</text>
    <g>
      <rect x="56" y="100" width="238" height="38" rx="8" fill="#f8fafc" stroke="#d5dbe4"/>
      <circle cx="74" cy="119" r="4" fill="#f8fafc" stroke="#a3acb8"/>
      <text x="88" y="124" fill="#18202a" font-size="12">SESSION 01</text>
      <text x="282" y="124" class="mono" fill="#2559c4" font-size="10" letter-spacing="0.8" text-anchor="end">RUN</text>
      <circle class="run-pulse" cx="74" cy="119" r="5" fill="none" stroke="#7a68e6" stroke-width="1.5"/>
      <g class="s1">
        <rect x="56" y="100" width="238" height="38" rx="8" fill="#3d7be0" fill-opacity="0.1" stroke="#3d7be0" stroke-opacity="0.55"/>
        <circle cx="74" cy="119" r="4" fill="#7a68e6"/>
      </g>
    </g>
    <g>
      <rect x="56" y="142" width="238" height="38" rx="8" fill="#f8fafc" stroke="#d5dbe4"/>
      <circle cx="74" cy="161" r="4" fill="#f8fafc" stroke="#a3acb8"/>
      <text x="88" y="166" fill="#5f6876" font-size="12">SESSION 02</text>
      <text x="282" y="166" class="mono" fill="#6c7583" font-size="10" letter-spacing="0.8" text-anchor="end">IDLE</text>
      <circle class="s2" cx="74" cy="161" r="5" fill="none" stroke="#3d7be0" stroke-width="2"/>
    </g>
    <g>
      <rect x="56" y="184" width="238" height="38" rx="8" fill="#f8fafc" stroke="#d5dbe4"/>
      <circle cx="74" cy="203" r="4" fill="#f8fafc" stroke="#a3acb8"/>
      <text x="88" y="208" fill="#18202a" font-size="12">SESSION 03</text>
      <text x="282" y="208" class="mono" fill="#2559c4" font-size="10" letter-spacing="0.8" text-anchor="end">DONE</text>
      <g class="s3">
        <rect x="56" y="184" width="238" height="38" rx="8" fill="#3d7be0" fill-opacity="0.1" stroke="#3d7be0" stroke-opacity="0.55"/>
        <circle cx="74" cy="203" r="4" fill="#7a68e6"/>
      </g>
    </g>
    <text x="58" y="246" fill="#6c7583" font-size="10">密钥只在本机使用</text>
  </g>

  <g id="usage-bars">
    <rect x="354" y="68" width="402" height="194" rx="10" fill="#ffffff" stroke="#d5dbe4"/>
    <ellipse class="glow" cx="555" cy="238" rx="176" ry="58" fill="url(#cardGlow)"/>
    <text x="372" y="90" class="mono" fill="#6c7583" font-size="11" letter-spacing="1.2">TOKENS / 30 MIN</text>
    <text x="738" y="90" class="mono" fill="#6c7583" font-size="10" letter-spacing="0.8" text-anchor="end">10 × 30 MIN</text>
    <line x1="372" y1="238" x2="738" y2="238" stroke="#d5dbe4"/>
    <rect class="bar" x="372" y="185.1" width="22" height="52.9" rx="3" fill="url(#barFill)" opacity="0.34"/>
    <rect class="bar" x="408" y="139.7" width="22" height="98.3" rx="3" fill="url(#barFill)" opacity="0.34"/>
    <rect class="bar" x="444" y="117.0" width="22" height="121.0" rx="3" fill="url(#barFill)" opacity="0.34"/>
    <rect class="bar" x="480" y="168.7" width="22" height="69.3" rx="3" fill="url(#barFill)" opacity="0.34"/>
    <rect class="bar" x="516" y="200.2" width="22" height="37.8" rx="3" fill="url(#barFill)" opacity="0.34"/>
    <rect class="bar" x="552" y="159.9" width="22" height="78.1" rx="3" fill="url(#barFill)" opacity="0.34"/>
    <rect class="bar" x="588" y="132.2" width="22" height="105.8" rx="3" fill="url(#barFill)" opacity="0.34"/>
    <rect class="bar" x="624" y="177.5" width="22" height="60.5" rx="3" fill="url(#barFill)" opacity="0.34"/>
    <rect class="bar" x="660" y="207.8" width="22" height="30.2" rx="3" fill="url(#barFill)" opacity="0.34"/>
    <rect class="bar" x="696" y="149.8" width="22" height="88.2" rx="3" fill="url(#barFill)" opacity="0.34"/>
    <g class="bright" clip-path="url(#revealClip)">
    <rect class="bar" x="372" y="185.1" width="22" height="52.9" rx="3" fill="url(#barFill)"/>
    <rect class="bar" x="408" y="139.7" width="22" height="98.3" rx="3" fill="url(#barFill)"/>
    <rect class="bar" x="444" y="117.0" width="22" height="121.0" rx="3" fill="url(#barFill)"/>
    <rect class="bar" x="480" y="168.7" width="22" height="69.3" rx="3" fill="url(#barFill)"/>
    <rect class="bar" x="516" y="200.2" width="22" height="37.8" rx="3" fill="url(#barFill)"/>
    <rect class="bar" x="552" y="159.9" width="22" height="78.1" rx="3" fill="url(#barFill)"/>
    <rect class="bar" x="588" y="132.2" width="22" height="105.8" rx="3" fill="url(#barFill)"/>
    <rect class="bar" x="624" y="177.5" width="22" height="60.5" rx="3" fill="url(#barFill)"/>
    <rect class="bar" x="660" y="207.8" width="22" height="30.2" rx="3" fill="url(#barFill)"/>
    <rect class="bar" x="696" y="149.8" width="22" height="88.2" rx="3" fill="url(#barFill)"/>
    </g>
    <g class="sweep-a">
      <rect x="364" y="104" width="16" height="134" fill="url(#sweepGlow)"/>
      <rect x="371" y="104" width="2" height="134" rx="1" fill="#7a68e6"/>
      <circle cx="372" cy="104" r="3" fill="#7a68e6"/>
    </g>
    <g class="sweep-b">
      <rect x="544" y="104" width="16" height="134" fill="url(#sweepGlow)"/>
      <rect x="551" y="104" width="2" height="134" rx="1" fill="#7a68e6"/>
      <circle cx="552" cy="104" r="3" fill="#7a68e6"/>
    </g>
  </g>

  <g id="cost-readout">
    <rect x="800" y="68" width="360" height="194" rx="10" fill="#ffffff" stroke="#d5dbe4"/>
    <text x="818" y="90" class="mono" fill="#6c7583" font-size="11" letter-spacing="1.2">COST / 30 MIN</text>
    <text x="818" y="140" fill="#18202a" font-size="30" font-weight="800">≈ ¥0.24</text>
    <g class="cost">
      <text x="818" y="140" fill="#2559c4" font-size="30" font-weight="800">≈ ¥0.24</text>
    </g>
    <rect class="cursor" x="936" y="124" width="3" height="16" fill="#7a68e6"/>
    <rect x="818" y="150" width="120" height="2" rx="1" fill="#3d7be0" opacity="0.35"/>
    <text x="818" y="168" fill="#6c7583" font-size="10">按公开 API 计价规则推算</text>
    <line x1="818" y1="182" x2="1142" y2="182" stroke="#d5dbe4"/>
    <text x="818" y="204" class="mono" fill="#6c7583" font-size="10" letter-spacing="1">BALANCE</text>
    <text x="818" y="232" fill="#5f6876" font-size="20" font-weight="700">—</text>
    <rect x="1004" y="204" width="138" height="24" rx="12" fill="none" stroke="#6c7583" stroke-opacity="0.45"/>
    <text x="1073" y="220" class="mono" fill="#6c7583" font-size="10" letter-spacing="0.6" text-anchor="middle">PRICE UNKNOWN</text>
    <g class="flag">
      <rect x="1004" y="204" width="138" height="24" rx="12" fill="#3d7be0" fill-opacity="0.1" stroke="#3d7be0" stroke-opacity="0.6"/>
      <text x="1073" y="220" class="mono" fill="#2559c4" font-size="10" letter-spacing="0.6" text-anchor="middle">PRICE UNKNOWN</text>
    </g>
  </g>

  <g id="connectors">
    <path d="M312 165H352" stroke="#3d7be0" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 5" fill="none"/>
    <path d="M758 165H798" stroke="#3d7be0" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 5" fill="none"/>
    <g class="packet-a">
      <circle cx="312" cy="165" r="11" fill="url(#packetGlow)"/>
      <circle cx="312" cy="165" r="5" fill="#7a68e6"/>
    </g>
    <g class="packet-b">
      <circle cx="758" cy="165" r="11" fill="url(#packetGlow)"/>
      <circle cx="758" cy="165" r="5" fill="#7a68e6"/>
    </g>
  </g>

  <g id="legend">
    <circle cx="44" cy="279" r="3" fill="#3d7be0"/>
    <text x="54" y="283" class="mono" fill="#5f6876" font-size="10" letter-spacing="0.8">SESSION</text>
    <circle cx="400" cy="279" r="3" fill="#7a68e6"/>
    <text x="410" y="283" class="mono" fill="#5f6876" font-size="10" letter-spacing="0.8">TOKENS</text>
    <circle cx="820" cy="279" r="3" fill="#3d7be0"/>
    <text x="830" y="283" class="mono" fill="#5f6876" font-size="10" letter-spacing="0.8">COST / BALANCE</text>
    <text x="1160" y="283" class="mono" fill="#6c7583" font-size="10" letter-spacing="0.8" text-anchor="end">KEY STAYS LOCAL</text>
  </g>
</svg>
