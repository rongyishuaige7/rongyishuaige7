<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">DSH Usage：按项目统计 DSH 会话用量</title>
  <desc id="desc">深色DSH Usage 项目卡。DeepSeek Harness 插件，按项目统计 Token、开发时长、费用和余额；未知价格明确标出，密钥仅在本机使用。TypeScript、DSH Plugin、Local-first，MIT 许可。npm 近 30 天下载 1,031 次，最新版本 0.4.3，已发布 94 个版本，下载统计截至 2026-10-18。项目总览可导出 CSV/JSON；开发时间线、近 7 / 30 / 90 天用量趋势与账户余额常驻显示。</desc>
  <defs>
    <linearGradient id="cardWash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6ea8ff" stop-opacity="0.085"/>
      <stop offset="1" stop-color="#6ea8ff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="ctaFill"><stop stop-color="#6ea8ff"/><stop offset="1" stop-color="#63ccf8"/></linearGradient>
    <linearGradient id="ctaShine"><stop stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <clipPath id="ctaClip"><rect x="64" y="281" width="144" height="54" rx="12"/></clipPath>
  </defs>
  <style>
    text { font-family: Arial, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .signal-reveal { transform-box: fill-box; transform-origin: left center; }
    @media (prefers-reduced-motion: no-preference) {
      .signal-reveal { animation: signal-reveal 1.4s ease-out 0.3s both; }
      .cta-shine { animation: cta-shine 0.9s ease-in-out 1.8s both; }
    }
    @keyframes signal-reveal {
      from { transform: scaleX(0); opacity: 0; }
      to { transform: scaleX(1); opacity: 1; }
    }
    @keyframes cta-shine {
      from { transform: translateX(0); }
      to { transform: translateX(260px); }
    }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="18" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="18" fill="url(#cardWash)" stroke="#6ea8ff" stroke-opacity="0.26"/>
  <g id="card-copy">
    <text x="64" y="74" fill="#f3f6fa" font-size="34" font-weight="700">DSH Usage</text>
    <text x="64" y="108" fill="#6ea8ff" font-size="18">DeepSeek Harness 插件</text>
    <text x="64" y="157" fill="#c3cad4" font-size="23">按项目统计 Token、开发时长、</text>
    <text x="64" y="190" fill="#c3cad4" font-size="23">费用和余额。</text>
    <text x="64" y="221" fill="#9da6b4" font-size="16">未知价格明确标出，密钥仅在本机使用。</text>
  </g>
  <g id="card-tags"><text x="64" y="250" fill="#9da6b4" font-size="16">TypeScript · DSH Plugin · Local-first</text></g>
  <g id="card-cta">
    <rect x="64" y="281" width="144" height="54" rx="12" fill="url(#ctaFill)"/>
    <g clip-path="url(#ctaClip)"><path class="cta-shine" d="M16 281H56L36 335H-4Z" fill="url(#ctaShine)"/></g>
    <text x="86" y="315" fill="#0b1020" font-size="19" font-weight="700">查看仓库 ↗</text>
  </g>
  <g id="card-status">
    <text x="232" y="300" fill="#9da6b4" font-size="16">已发布到 npm · MIT</text>
    <text x="232" y="327" fill="#737e8e" font-size="16" class="mono">@rongyi7/dsh-stats</text>
  </g>
  <g id="dsh-panel">
    <rect x="475.5" y="40.5" width="678" height="299" rx="14" fill="#080b10" stroke="#262c35"/>
    <g id="card-metrics">
      <rect x="499.5" y="64.5" width="630" height="99" rx="12" fill="#0a0e15" stroke="#6ea8ff" stroke-opacity="0.22"/>
      <path d="M815 65V163" stroke="#6ea8ff" stroke-opacity="0.16"/>
      <text x="523" y="96" fill="#9da6b4" font-size="18">近 30 天下载</text>
      <text id="npm-downloads" x="523" y="140" fill="#f3f6fa" font-size="34" font-weight="600" class="mono">1,031</text>
      <text x="839" y="96" fill="#9da6b4" font-size="18">npm 最新版本</text>
      <text id="npm-latest" x="839" y="140" fill="#f3f6fa" font-size="34" font-weight="600" class="mono">0.4.3</text>
    </g>
    <g id="card-views" fill="#c3cad4" font-size="18">
      <g id="view-1" class="view-1"><text x="523" y="216">项目总览 · 可导出 CSV/JSON</text></g>
      <g id="view-2" class="view-2"><text x="839" y="216">开发时间线</text></g>
      <g id="view-3" class="view-3"><text x="523" y="265">用量趋势 · 近 7 / 30 / 90 天</text></g>
      <g id="view-4" class="view-4"><text x="839" y="265">账户余额</text></g>
      <rect class="signal-reveal" x="499" y="286" width="630" height="2" rx="1" fill="#6ea8ff" opacity="0.65"/>
    </g>
    <text id="npm-as-of" x="523" y="322" fill="#9da6b4" font-size="17">npm 下载统计截至 2026-10-18</text>
  </g>
</svg>
