<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">DSH Usage：按项目统计会话用量</title>
  <desc id="desc">深色DSH Usage 项目卡。DeepSeek Harness 用量插件，按项目统计 Token、开发时长和预估费用，另含账户余额查询。右侧为功能示意，非产品截图：会话记录按项目归集，形成用量柱和开发时间线；图形不代表真实用量。项目总览可导出 CSV/JSON，用量趋势可选近 7 / 30 / 90 天。npm 近 30 天下载 1,031 次，最新版本 0.5.0，已发布 95 个版本，下载统计截至 2026-10-18。包名 @rongyi7/dsh-stats，MIT 许可。</desc>
  <defs>
    <linearGradient id="cardWash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6ea8ff" stop-opacity="0.12"/><stop offset="1" stop-color="#6ea8ff" stop-opacity="0.02"/></linearGradient>
    <linearGradient id="laneFill"><stop stop-color="#6ea8ff"/><stop offset="1" stop-color="#63ccf8"/></linearGradient>
  </defs>
  <style>
    text { font-family: Arial, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .record, .usage-bars, .time-lane, .cta-arrow { transform-box: fill-box; }
    .usage-bars { transform-origin: center bottom; }
    .time-lane { transform-origin: left center; }
    .packet, .timeline-scan { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .record-a { animation: record-a 8s ease-in-out -0.4s 3; }
      .record-b { animation: record-b 8s ease-in-out -0.4s 3; }
      .record-c { animation: record-c 8s ease-in-out -0.4s 3; }
      .packet-a { animation: packet-a 8s linear -0.4s 3; }
      .packet-b { animation: packet-b 8s linear -0.4s 3; }
      .packet-c { animation: packet-c 8s linear -0.4s 3; }
      .project-a { animation: project-a 8s ease-in-out -0.4s 3; }
      .project-b { animation: project-b 8s ease-in-out -0.4s 3; }
      .project-c { animation: project-c 8s ease-in-out -0.4s 3; }
      .usage-a { animation: usage-a 8s cubic-bezier(0.2, 0.7, 0.2, 1) -0.4s 3; }
      .usage-b { animation: usage-b 8s cubic-bezier(0.2, 0.7, 0.2, 1) -0.4s 3; }
      .usage-c { animation: usage-c 8s cubic-bezier(0.2, 0.7, 0.2, 1) -0.4s 3; }
      .lane-a { animation: lane-a 8s cubic-bezier(0.2, 0.7, 0.2, 1) -0.4s 3; }
      .lane-b { animation: lane-b 8s cubic-bezier(0.2, 0.7, 0.2, 1) -0.4s 3; }
      .lane-c { animation: lane-c 8s cubic-bezier(0.2, 0.7, 0.2, 1) -0.4s 3; }
      .timeline-scan { animation: timeline-scan 8s ease-in-out -0.4s 3; }
      .cta-arrow { animation: cta-nudge 8s ease-out -0.4s 3; }
    }
    @keyframes record-a {
      0% { opacity: 1; transform: translateY(0); }
      5%, 8% { opacity: 0.35; transform: translateY(8px); }
      12%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes record-b {
      0% { opacity: 1; transform: translateY(0); }
      5%, 10% { opacity: 0.35; transform: translateY(8px); }
      14%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes record-c {
      0% { opacity: 1; transform: translateY(0); }
      5%, 12% { opacity: 0.35; transform: translateY(8px); }
      16%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes packet-a {
      0%, 22% { opacity: 0; transform: translateX(0); }
      23% { opacity: 1; transform: translateX(0); }
      26% { transform: translateX(12px); }
      31% { transform: translateX(55px); }
      35% { opacity: 1; transform: translateX(85px); }
      36%, 100% { opacity: 0; transform: translateX(var(--packet-distance, 98px)); }
    }
    @keyframes packet-b {
      0%, 25% { opacity: 0; transform: translateX(0); }
      26% { opacity: 1; transform: translateX(0); }
      29% { transform: translateX(12px); }
      34% { transform: translateX(55px); }
      38% { opacity: 1; transform: translateX(85px); }
      39%, 100% { opacity: 0; transform: translateX(var(--packet-distance, 98px)); }
    }
    @keyframes packet-c {
      0%, 28% { opacity: 0; transform: translateX(0); }
      29% { opacity: 1; transform: translateX(0); }
      32% { transform: translateX(12px); }
      37% { transform: translateX(55px); }
      41% { opacity: 1; transform: translateX(85px); }
      42%, 100% { opacity: 0; transform: translateX(var(--packet-distance, 98px)); }
    }
    @keyframes project-a {
      0% { opacity: 1; }
      5%, 34% { opacity: 0.4; }
      36% { opacity: 1; }
      39% { opacity: 0.75; }
      42%, 100% { opacity: 1; }
    }
    @keyframes project-b {
      0% { opacity: 1; }
      5%, 37% { opacity: 0.4; }
      39% { opacity: 1; }
      42% { opacity: 0.75; }
      45%, 100% { opacity: 1; }
    }
    @keyframes project-c {
      0% { opacity: 1; }
      5%, 40% { opacity: 0.4; }
      42% { opacity: 1; }
      45% { opacity: 0.75; }
      48%, 100% { opacity: 1; }
    }
    @keyframes usage-a {
      0% { opacity: 1; transform: none; }
      5%, 46% { opacity: 0.35; transform: scaleY(0.15); }
      52% { opacity: 1; transform: scaleY(1.08); }
      56% { transform: scaleY(0.97); }
      59%, 100% { opacity: 1; transform: none; }
    }
    @keyframes usage-b {
      0% { opacity: 1; transform: none; }
      5%, 49% { opacity: 0.35; transform: scaleY(0.15); }
      55% { opacity: 1; transform: scaleY(1.08); }
      59% { transform: scaleY(0.97); }
      62%, 100% { opacity: 1; transform: none; }
    }
    @keyframes usage-c {
      0% { opacity: 1; transform: none; }
      5%, 52% { opacity: 0.35; transform: scaleY(0.15); }
      58% { opacity: 1; transform: scaleY(1.08); }
      62% { transform: scaleY(0.97); }
      65%, 100% { opacity: 1; transform: none; }
    }
    @keyframes lane-a {
      0% { opacity: 1; transform: none; }
      5%, 56% { opacity: 0.35; transform: scaleX(0.1); }
      62% { opacity: 1; transform: scaleX(1.04); }
      66% { transform: scaleX(0.99); }
      69%, 100% { opacity: 1; transform: none; }
    }
    @keyframes lane-b {
      0% { opacity: 1; transform: none; }
      5%, 59% { opacity: 0.35; transform: scaleX(0.1); }
      65% { opacity: 1; transform: scaleX(1.04); }
      69% { transform: scaleX(0.99); }
      72%, 100% { opacity: 1; transform: none; }
    }
    @keyframes lane-c {
      0% { opacity: 1; transform: none; }
      5%, 62% { opacity: 0.35; transform: scaleX(0.1); }
      68% { opacity: 1; transform: scaleX(1.04); }
      72% { transform: scaleX(0.99); }
      75%, 100% { opacity: 1; transform: none; }
    }
    @keyframes timeline-scan {
      0%, 72% { opacity: 0; transform: translateX(0); }
      74% { opacity: 0.95; transform: translateX(0); }
      90% { opacity: 0.95; transform: translateX(290px); }
      92%, 100% { opacity: 0; transform: translateX(290px); }
    }
    @keyframes cta-nudge {
      0%, 92% { transform: translateX(0); }
      95% { transform: translateX(6px); }
      98% { transform: translateX(1px); }
      100% { transform: translateX(0); }
    }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="18" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="18" fill="url(#cardWash)" stroke="#6ea8ff" stroke-opacity="0.26"/>
  <g id="card-copy">
    <text x="48" y="72" fill="#f3f6fa" font-size="37" font-weight="700">DSH Usage</text>
    <text x="48" y="107" fill="#6ea8ff" font-size="18">DeepSeek Harness 用量插件</text>
    <text x="48" y="157" fill="#f3f6fa" font-size="23">按项目统计会话用量</text>
  </g>
  <g id="card-tags"><text x="48" y="191" fill="#c3cad4" font-size="18">Token · 开发时长 · 预估费用</text></g>
  <path d="M48 222H350M397 48V372" fill="none" stroke="#262c35"/>
  <g id="card-metrics">
    <text x="48" y="253" fill="#9da6b4" font-size="17">近 30 天下载</text>
    <text x="218" y="253" fill="#9da6b4" font-size="17">npm 最新版本</text>
    <text id="npm-downloads" x="48" y="293" fill="#f3f6fa" font-size="32" font-weight="600" class="mono">1,031</text>
    <text id="npm-latest" x="218" y="293" fill="#f3f6fa" font-size="32" font-weight="600" class="mono">0.5.0</text>
  </g>
  <text id="npm-as-of" x="48" y="324" fill="#9da6b4" font-size="17">统计截至 2026-10-18</text>
  <g id="card-cta">
    <text x="48" y="377" fill="#6ea8ff" font-size="19" font-weight="600">查看仓库</text>
    <path class="cta-arrow" d="M137 377L150 364M140 364H150V374" fill="none" stroke="#6ea8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="card-status"><text x="350" y="377" fill="#9da6b4" font-size="17" text-anchor="end">npm · MIT</text></g>
  <g id="dsh-panel">
    <text x="443" y="75" fill="#f3f6fa" font-size="24" font-weight="600">会话 → 项目 → 时间线</text>
    <text id="flow-caption" x="1148" y="75" fill="#9da6b4" font-size="17" text-anchor="end">功能示意</text>
    <text id="session-source" x="443" y="128" fill="#9da6b4" font-size="17">会话记录</text>
    <text id="project-grouping" x="645" y="128" fill="#9da6b4" font-size="17">按项目归集</text>
    <g id="card-views">
      <g id="view-2"><text x="815" y="128" fill="#9da6b4" font-size="17">开发时间线</text></g>
      <g id="session-records" fill="#142033" stroke="#262c35">
        <g class="record record-a"><rect x="443" y="152" width="104" height="46" rx="8"/><text x="457" y="181" fill="#c3cad4" stroke="none" font-size="18">会话 A</text></g>
        <g class="record record-b"><rect x="443" y="214" width="104" height="46" rx="8"/><text x="457" y="243" fill="#c3cad4" stroke="none" font-size="18">会话 B</text></g>
        <g class="record record-c"><rect x="443" y="276" width="104" height="46" rx="8"/><text x="457" y="305" fill="#c3cad4" stroke="none" font-size="18">会话 C</text></g>
      </g>
      <g id="session-links" fill="none" stroke="#45494f"><path d="M548 175H645M548 237H645M548 299H645"/><path d="M755 175H815M755 237H815M755 299H815"/></g>
      <g id="session-packets" fill="#63ccf8">
        <rect class="packet packet-a" x="552" y="172" width="12" height="6" rx="3"/>
        <rect class="packet packet-b" x="552" y="234" width="12" height="6" rx="3"/>
        <rect class="packet packet-c" x="552" y="296" width="12" height="6" rx="3"/>
      </g>
      <g id="project-groups" fill="#080b10" stroke="#6ea8ff" stroke-opacity="0.6">
        <g class="project-a"><rect x="645" y="152" width="109" height="46" rx="8"/><text x="661" y="181" fill="#f3f6fa" stroke="none" font-size="18">项目 A</text></g>
        <g class="project-b"><rect x="645" y="214" width="109" height="46" rx="8"/><text x="661" y="243" fill="#f3f6fa" stroke="none" font-size="18">项目 B</text></g>
        <g class="project-c"><rect x="645" y="276" width="109" height="46" rx="8"/><text x="661" y="305" fill="#f3f6fa" stroke="none" font-size="18">项目 C</text></g>
      </g>
      <g fill="#63ccf8"><circle cx="798" cy="175" r="3"/><circle cx="798" cy="237" r="3"/><circle cx="798" cy="299" r="3"/></g>
      <g id="timeline-illustration">
        <rect x="815" y="151" width="333" height="173" rx="11" fill="#080b10" stroke="#262c35"/>
        <path d="M854 166V308M906 166V308M958 166V308M1010 166V308M1062 166V308M1114 166V308M834 231H1129" fill="none" stroke="#141920"/>
        <g fill="#6ea8ff">
          <g class="usage-bars usage-a"><rect x="837" y="208" width="12" height="16" rx="3"/><rect x="861" y="194" width="12" height="30" rx="3"/><rect x="885" y="202" width="12" height="22" rx="3"/><rect x="909" y="184" width="12" height="40" rx="3"/></g>
          <g class="usage-bars usage-b"><rect x="933" y="196" width="12" height="28" rx="3"/><rect x="957" y="177" width="12" height="47" rx="3"/><rect x="981" y="191" width="12" height="33" rx="3"/><rect x="1005" y="171" width="12" height="53" rx="3"/></g>
          <g class="usage-bars usage-c"><rect x="1029" y="182" width="12" height="42" rx="3"/><rect x="1053" y="201" width="12" height="23" rx="3"/><rect x="1077" y="188" width="12" height="36" rx="3"/><rect x="1101" y="207" width="12" height="17" rx="3"/></g>
        </g>
        <g fill="url(#laneFill)">
          <g class="time-lane lane-a"><rect x="837" y="247" width="86" height="8" rx="4"/><rect x="960" y="247" width="130" height="8" rx="4"/></g>
          <g class="time-lane lane-b"><rect x="870" y="272" width="141" height="8" rx="4"/><rect x="1030" y="272" width="64" height="8" rx="4"/></g>
          <g class="time-lane lane-c"><rect x="837" y="297" width="55" height="8" rx="4"/><rect x="934" y="297" width="110" height="8" rx="4"/><rect x="1070" y="297" width="52" height="8" rx="4"/></g>
        </g>
        <g class="timeline-scan"><path d="M835 163V312" stroke="#63ccf8" stroke-width="2"/><rect x="835" y="163" width="12" height="149" fill="#63ccf8" opacity="0.08"/></g>
      </g>
      <g id="view-1"><text x="443" y="375" fill="#9da6b4" font-size="17">项目总览 · CSV/JSON 导出</text></g>
      <g id="view-3"><text x="710" y="375" fill="#9da6b4" font-size="17">用量趋势 · 近 7 / 30 / 90 天</text></g>
      <g id="view-4"><text x="1148" y="375" fill="#9da6b4" font-size="17" text-anchor="end">账户余额查询</text></g>
    </g>
  </g>
</svg>
