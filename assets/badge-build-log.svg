<svg xmlns="http://www.w3.org/2000/svg" width="148" height="36" viewBox="0 0 148 36" role="img" aria-labelledby="title desc">
  <title id="title">查看开发记录</title>
  <desc id="desc">前往 Rongyi 的公开开发记录。</desc>
  <style>
    text { font-family: Arial, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-weight: 700; }
    .surface { fill: #ffffff; }
    .label { fill: #c8452a; }
    .action { fill: #18202a; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #202631; }
      .label { fill: #ff8a70; }
      .action { fill: #f4f6f8; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .cursor { animation: cursor 1.1s steps(1, end) infinite; }
    }
    @keyframes cursor {
      0% { opacity: 1; }
      50% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
  <rect class="surface" x="0.5" y="0.5" width="147" height="35" rx="8" fill="#ffffff" stroke="#e45738"/>
  <text class="label" x="14" y="22" fill="#c8452a" font-size="10" letter-spacing="1">BUILD</text>
  <path d="M62 8V28" stroke="#e45738" stroke-opacity="0.55"/>
  <text class="action" x="76" y="23" fill="#18202a" font-size="14">开发记录</text>
  <rect class="label cursor" x="52" y="13" width="5" height="10" fill="#c8452a"/>
</svg>
