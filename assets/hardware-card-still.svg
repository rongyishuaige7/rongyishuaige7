<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Hardware Lab：22 个公开硬件项目</title>
  <desc id="desc">深浅主题自适应Hardware Lab 项目卡。22 个公开硬件项目统一收录在 Hardware Lab 索引，每个附项目介绍、构建证据与使用限制。条形图按主控平台统计公开项目数：ESP32 15 个、STM32 3 个、树莓派 3 个、Arduino 1 个。</desc>
  <defs>
    <linearGradient id="cardWash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--touch)" stop-opacity="0.12"/><stop offset="1" stop-color="var(--touch)" stop-opacity="0.02"/></linearGradient>
  </defs>
  <style>
    :root { --shell: #edf0f4; --shell_stroke: #cbd2dc; --panel_stroke: #cbd2dc; --surface_a: #ffffff; --surface_b: #f7f8fa; --surface_c: #f6f7fb; --grid_line: #8795a3; --grid_opacity: 0.42; --card: #ffffff; --ink: #18202a; --muted: #5f6876; --faint: #646d7b; --carry: #e45738; --carry_2: #f08a2c; --carry_text: #c8452a; --see: #3d7be0; --see_2: #1e93cc; --see_text: #2559c4; --touch: #1aa572; --touch_2: #7cc23a; --touch_text: #0b7d50; --soft: #3a4350; --tint: 0.08; --drive_port: #eef1f5; --drive_face_a: #ffffff; --drive_face_b: #eef1f6; --drive_slot: #dde3ea; --drive_slot_stroke: #b9c2cd; --drive_ink: #18202a; --shine: #f08a2c; --shine_opacity: 0.2; --shadow_opacity: 0.16; --shot_bg: #f3f5f8; --page_bg: #ffffff; --wash: 0.06; --glow: 0.07; --fig_bg: #fbfcfd; --fig_stroke: #dfe3e8; --fig_grid: #eef1f5; --cta_ink: #17100d; --tag_fill: #f7f8fa; --tag_stroke: #d5dbe4; --see_wash: 0.06; --see_glow: 0.07; --see_ink: #0b1020; --metric_bg: #ffffff; --tab_bg: #f4f6f9; --pill_fill: #e8f0fd; --drive_fill: 0.03; --flow_tag: #b4520e; --link_line: #b9c1cc; --link_head: #7d8794; --link_dot: #4c5562; --cloud_stroke: #9aa3ae; --cloud_lit: #4c5562; }
    .theme-dark { display: none; }
    @media (prefers-color-scheme: dark) { :root { --shell: #080c13; --shell_stroke: #303846; --panel_stroke: #414b5b; --surface_a: #111722; --surface_b: #0b1018; --surface_c: #121117; --grid_line: #526171; --grid_opacity: 0.5; --card: #101722; --ink: #f3f6fa; --muted: #9da6b4; --faint: #737e8e; --carry: #ff6b4a; --carry_2: #ff9a3d; --carry_text: #ff6b4a; --see: #6ea8ff; --see_2: #63ccf8; --see_text: #6ea8ff; --touch: #46d89c; --touch_2: #b6ec6a; --touch_text: #46d89c; --soft: #c3cad4; --tint: 0.12; --drive_port: #161a21; --drive_face_a: #20252d; --drive_face_b: #0d1117; --drive_slot: #232934; --drive_slot_stroke: #4e5663; --drive_ink: #f3f6fa; --shine: #ffffff; --shine_opacity: 0.16; --shadow_opacity: 0.45; --shot_bg: #161a21; --page_bg: #0d1117; --wash: 0.085; --glow: 0.1; --fig_bg: #080b10; --fig_stroke: #262c35; --fig_grid: #141920; --cta_ink: #17100d; --tag_fill: #12161d; --tag_stroke: #2b3038; --see_wash: 0.085; --see_glow: 0.1; --see_ink: #0b1020; --metric_bg: #0a0e15; --tab_bg: #0b0f16; --pill_fill: #142033; --drive_fill: 0.03; --flow_tag: #ff9a3d; --link_line: #45494f; --link_head: #85878b; --link_dot: #e8edf3; --cloud_stroke: #5a5f66; --cloud_lit: #c7ced8; } .theme-light { display: none; } .theme-dark { display: inline; } }

    text { font-family: Arial, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    .bar { transform-box: fill-box; transform-origin: 0 50%; }



  </style>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="var(--page_bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="url(#cardWash)" stroke="var(--touch)" stroke-opacity="0.26"/>
  <g id="card-copy">
    <text x="48" y="72" fill="var(--ink)" font-size="37" font-weight="700">Hardware Lab</text>
    <text x="48" y="107" fill="var(--touch_text)" font-size="18">硬件原型索引</text>
    <text id="hardware-count" x="48" y="157" fill="var(--ink)" font-size="23">22 个公开硬件项目</text>
  </g>
  <g id="card-tags"><text x="48" y="191" fill="var(--soft)" font-size="18">项目介绍 · 构建证据 · 使用限制</text></g>
  <path d="M397 48V252" fill="none" stroke="var(--fig_stroke)"/>
  <g id="card-cta">
    <text x="48" y="257" fill="var(--touch_text)" font-size="19" font-weight="600">查看项目索引</text>
    <path d="M175 257L188 244M178 244H188V254" fill="none" stroke="var(--touch_text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="platform-chart">
    <text x="443" y="75" fill="var(--ink)" font-size="24" font-weight="600">按主控平台</text>
    <text x="1148" y="75" fill="var(--muted)" font-size="17" text-anchor="end">公开项目数</text>
    <path d="M560.5 100V258" fill="none" stroke="var(--fig_stroke)"/>
    <g id="platform-1">
      <text x="544" y="125" fill="var(--soft)" font-size="18" text-anchor="end">ESP32</text>
      <path class="bar bar-1" d="M560 108H1066A4 4 0 0 1 1070 112V126A4 4 0 0 1 1066 130H560Z" fill="var(--touch_text)"/>
      <text class="value" x="1080" y="125" fill="var(--ink)" font-size="18" font-weight="700">15</text>
    </g>
    <g id="platform-2">
      <text x="544" y="165" fill="var(--soft)" font-size="18" text-anchor="end">STM32</text>
      <path class="bar bar-2" d="M560 148H658A4 4 0 0 1 662 152V166A4 4 0 0 1 658 170H560Z" fill="var(--touch_text)"/>
      <text class="value" x="672" y="165" fill="var(--ink)" font-size="18" font-weight="700">3</text>
    </g>
    <g id="platform-3">
      <text x="544" y="205" fill="var(--soft)" font-size="18" text-anchor="end">树莓派</text>
      <path class="bar bar-3" d="M560 188H658A4 4 0 0 1 662 192V206A4 4 0 0 1 658 210H560Z" fill="var(--touch_text)"/>
      <text class="value" x="672" y="205" fill="var(--ink)" font-size="18" font-weight="700">3</text>
    </g>
    <g id="platform-4">
      <text x="544" y="245" fill="var(--soft)" font-size="18" text-anchor="end">Arduino</text>
      <path class="bar bar-4" d="M560 228H590A4 4 0 0 1 594 232V246A4 4 0 0 1 590 250H560Z" fill="var(--touch_text)"/>
      <text class="value" x="604" y="245" fill="var(--ink)" font-size="18" font-weight="700">1</text>
    </g>
  </g>
</svg>
