<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Hardware Lab：22 个公开硬件项目</title>
  <desc id="desc">深色Hardware Lab 项目卡。22 个公开硬件项目统一收录在 Hardware Lab 索引，每个附项目介绍、构建证据与使用限制。条形图按主控平台统计公开项目数：ESP32 15 个、STM32 3 个、树莓派 3 个、Arduino 1 个。</desc>
  <defs>
    <linearGradient id="cardWash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#46d89c" stop-opacity="0.12"/><stop offset="1" stop-color="#46d89c" stop-opacity="0.02"/></linearGradient>
  </defs>
  <style>
    text { font-family: Arial, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    .bar { transform-box: fill-box; transform-origin: 0 50%; }
    @media (prefers-reduced-motion: no-preference) {
      .bar-1 { animation: bar-grow 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both; }
      .bar-2 { animation: bar-grow 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.32s both; }
      .bar-3 { animation: bar-grow 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.44s both; }
      .bar-4 { animation: bar-grow 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.56s both; }
      .value { animation: value-in 0.4s ease-out 1.2s both; }
    }
    @keyframes bar-grow {
      from { transform: scaleX(0); }
      to { transform: none; }
    }
    @keyframes value-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="url(#cardWash)" stroke="#46d89c" stroke-opacity="0.26"/>
  <g id="card-copy">
    <text x="48" y="72" fill="#f3f6fa" font-size="37" font-weight="700">Hardware Lab</text>
    <text x="48" y="107" fill="#46d89c" font-size="18">硬件原型索引</text>
    <text id="hardware-count" x="48" y="157" fill="#f3f6fa" font-size="23">22 个公开硬件项目</text>
  </g>
  <g id="card-tags"><text x="48" y="191" fill="#c3cad4" font-size="18">项目介绍 · 构建证据 · 使用限制</text></g>
  <path d="M397 48V252" fill="none" stroke="#262c35"/>
  <g id="card-cta">
    <text x="48" y="257" fill="#46d89c" font-size="19" font-weight="600">查看项目索引</text>
    <path d="M175 257L188 244M178 244H188V254" fill="none" stroke="#46d89c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="platform-chart">
    <text x="443" y="75" fill="#f3f6fa" font-size="24" font-weight="600">按主控平台</text>
    <text x="1148" y="75" fill="#9da6b4" font-size="17" text-anchor="end">公开项目数</text>
    <path d="M560.5 100V258" fill="none" stroke="#262c35"/>
    <g id="platform-1">
      <text x="544" y="125" fill="#c3cad4" font-size="18" text-anchor="end">ESP32</text>
      <path class="bar bar-1" d="M560 108H1066A4 4 0 0 1 1070 112V126A4 4 0 0 1 1066 130H560Z" fill="#46d89c"/>
      <text class="value" x="1080" y="125" fill="#f3f6fa" font-size="18" font-weight="700">15</text>
    </g>
    <g id="platform-2">
      <text x="544" y="165" fill="#c3cad4" font-size="18" text-anchor="end">STM32</text>
      <path class="bar bar-2" d="M560 148H658A4 4 0 0 1 662 152V166A4 4 0 0 1 658 170H560Z" fill="#46d89c"/>
      <text class="value" x="672" y="165" fill="#f3f6fa" font-size="18" font-weight="700">3</text>
    </g>
    <g id="platform-3">
      <text x="544" y="205" fill="#c3cad4" font-size="18" text-anchor="end">树莓派</text>
      <path class="bar bar-3" d="M560 188H658A4 4 0 0 1 662 192V206A4 4 0 0 1 658 210H560Z" fill="#46d89c"/>
      <text class="value" x="672" y="205" fill="#f3f6fa" font-size="18" font-weight="700">3</text>
    </g>
    <g id="platform-4">
      <text x="544" y="245" fill="#c3cad4" font-size="18" text-anchor="end">Arduino</text>
      <path class="bar bar-4" d="M560 228H590A4 4 0 0 1 594 232V246A4 4 0 0 1 590 250H560Z" fill="#46d89c"/>
      <text class="value" x="604" y="245" fill="#f3f6fa" font-size="18" font-weight="700">1</text>
    </g>
  </g>
</svg>
