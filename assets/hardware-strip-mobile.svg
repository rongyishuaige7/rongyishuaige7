      0%, 1% { opacity: 0; stroke-dashoffset: 22px; }
      2% { opacity: 1; stroke-dashoffset: 22px; }
      8.3% { opacity: 1; stroke-dashoffset: 6px; }
      18.2% { opacity: 1; stroke-dashoffset: -19.46px; }
      30% { opacity: 1; stroke-dashoffset: -49.46px; }
      38.62%, 100% { opacity: 0; stroke-dashoffset: -71.46px; }
    }
