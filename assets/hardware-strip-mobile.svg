      50% { transform: translate(0, 0); opacity: 1; }
      54.4% { transform: translate(12px, 0px); }
      63.6% { transform: translate(30px, 18px); }
      76% { transform: translate(64px, 18px); opacity: 1; }
      77%, 100% { transform: translate(64px, 18px); opacity: 0; }
    }
    @keyframes led-a {
