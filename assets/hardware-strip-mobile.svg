<svg xmlns="http://www.w3.org/2000/svg" width="360" height="222" viewBox="0 0 360 222" role="img" aria-labelledby="title desc">
  <title id="title">Hardware Lab 电路走线示意</title>
  <desc id="desc">电路板示意。左侧三路传感器信号沿走线汇入中间标注 HW LAB 与 22 PROTOTYPES 的芯片，芯片亮起后信号继续流向右侧红、黄、绿三颗 LED，LED 依次点亮。结构示意，非实物照片。</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="var(--surface_a)"/>
      <stop offset="1" stop-color="var(--surface_b)"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="var(--touch)" stop-opacity="0.6"/>
      <stop offset="0.35" stop-color="var(--touch)" stop-opacity="0"/>
      <stop offset="0.7" stop-color="var(--touch_2)" stop-opacity="0"/>
      <stop offset="1" stop-color="var(--touch_2)" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="ledGlow-a">
      <stop stop-color="var(--led_red)" stop-opacity="0.6"/>
      <stop offset="1" stop-color="var(--led_red)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ledGlow-b">
      <stop stop-color="var(--led_amber)" stop-opacity="0.6"/>
      <stop offset="1" stop-color="var(--led_amber)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ledGlow-c">
      <stop stop-color="var(--led_green)" stop-opacity="0.6"/>
      <stop offset="1" stop-color="var(--led_green)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.9" fill="var(--touch)" opacity="0.18"/>
    </pattern>
    <clipPath id="panelClip">
      <rect x="10" y="10" width="340" height="202" rx="14"/>
    </clipPath>
  </defs>
  <style>
