<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">DSH Usage：按项目统计会话用量</title>
  <desc id="desc">深浅主题自适应DSH Usage 项目卡。DeepSeek Harness 用量插件，按项目统计 Token、开发时长和预估费用，另含账户余额查询。右侧为功能示意，非产品截图：会话记录按项目归集，形成用量柱和开发时间线；图形不代表真实用量。项目总览可导出 CSV/JSON，用量趋势可选近 7 / 30 / 90 天。npm 近 30 天下载 1,031 次，最新版本 0.5.0，已发布 95 个版本，下载统计截至 2026-10-18。包名 @rongyi7/dsh-stats，MIT 许可。</desc>
  <defs>
    <linearGradient id="cardWash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--see)" stop-opacity="0.12"/><stop offset="1" stop-color="var(--see)" stop-opacity="0.02"/></linearGradient>
    <linearGradient id="laneFill"><stop stop-color="var(--see)"/><stop offset="1" stop-color="var(--see_2)"/></linearGradient>
    <clipPath id="odoClip"><rect x="44" y="264" width="170" height="38"/></clipPath>
  </defs>
