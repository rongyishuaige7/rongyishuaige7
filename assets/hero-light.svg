<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Rongyi，独立开发者 · Yi盘创始人</title>
  <desc id="desc">浅色品牌横幅。左侧是三行主张：随身的上下文，看得见的 Agent，摸得着的硬件。右侧是三条线的工作室结构示意：Yi盘居中，左边列出三个公开 Agent 工具（DSH Usage、dsh-spec、DevFlow），右边是硬件原型电路板，信号从中心依次流向两侧。结构示意，非产品截图。</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#f6f7fb"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#e45738" stop-opacity="0.7"/>
      <stop offset="0.3" stop-color="#e45738" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#1aa572" stop-opacity="0"/>
      <stop offset="1" stop-color="#1aa572" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.78"/>
    </linearGradient>
    <radialGradient id="washCarry">
      <stop stop-color="#e45738" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#e45738" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="washSee">
      <stop stop-color="#3d7be0" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#3d7be0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="washTouch">
      <stop stop-color="#1aa572" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#1aa572" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreFill">
      <stop stop-color="#e45738" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#e45738" stop-opacity="0.05"/>
    </radialGradient>
    <radialGradient id="ledGlow">
      <stop stop-color="#1aa572" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1aa572" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8795a3" stroke-width="0.6" opacity="0.42"/>
      <circle r="1" fill="#e45738" opacity="0.15"/>
    </pattern>
    <mask id="gridMask" maskUnits="userSpaceOnUse" x="16" y="16" width="1168" height="328">
      <rect x="16" y="16" width="1168" height="328" fill="url(#gridFade)"/>
    </mask>
    <marker id="arrowSee" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#3d7be0"/>
    </marker>
    <marker id="arrowTouch" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#1aa572"/>
    </marker>
    <clipPath id="panelClip">
      <rect x="16" y="16" width="1168" height="328" rx="16"/>
    </clipPath>
  </defs>
  <style>
    text { font-family: Arial, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .route { stroke-dasharray: 4 7; stroke-linecap: round; }
    .orbit { stroke-dasharray: 2 6; }
    .underline, .core-pulse { transform-box: fill-box; }
    .underline { transform-origin: 0 50%; }
    .core-pulse { transform-origin: 50% 50%; }
    .orbit-a, .orbit-b, .orbit-c { transform-box: view-box; transform-origin: 853px 180px; }
    .packet, .activity, .lit, .core-pulse { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .underline { animation: underline 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      .orbit-a { animation: spin 14s linear infinite; }
      .orbit-b { animation: spin 20s linear infinite reverse; }
      .orbit-c { animation: spin 26s linear infinite; }
      .core-pulse { animation: core-pulse 7.2s ease-out infinite; }
      .packet-see { animation: packet-see 7.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .activity-see { animation: activity-see 7.2s ease-in-out infinite; }
      .packet-touch { animation: packet-touch 7.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .pulse-a { animation: pulse-a 7.2s linear infinite; }
      .pulse-b { animation: pulse-b 7.2s linear infinite; }
      .pulse-c { animation: pulse-c 7.2s linear infinite; }
      .lit-a { animation: lit-a 7.2s ease-in-out infinite; }
      .lit-b { animation: lit-b 7.2s ease-in-out infinite; }
      .lit-c { animation: lit-c 7.2s ease-in-out infinite; }
    }
    @keyframes underline {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes core-pulse {
      0%, 1% { transform: scale(1); opacity: 0; }
      2% { transform: scale(1); opacity: 0.85; }
      12%, 100% { transform: scale(1.7); opacity: 0; }
    }
    @keyframes packet-see {
      0%, 12% { transform: translateX(0); opacity: 0; }
      13% { transform: translateX(0); opacity: 1; }
      26% { transform: translateX(-49px); opacity: 1; }
      27%, 100% { transform: translateX(-49px); opacity: 0; }
    }
    @keyframes activity-see {
      0%, 27% { opacity: 0; }
      29%, 37% { opacity: 1; }
      41%, 100% { opacity: 0; }
    }
    @keyframes packet-touch {
      0%, 41% { transform: translateX(0); opacity: 0; }
      42% { transform: translateX(0); opacity: 1; }
      55% { transform: translateX(49px); opacity: 1; }
      56%, 100% { transform: translateX(49px); opacity: 0; }
    }
    @keyframes pulse-a {
      0%, 56% { transform: translate(0, 0); opacity: 0; }
      57% { transform: translate(0, 0); opacity: 1; }
      61.5% { transform: translate(24px, 0); }
      65.5% { transform: translate(38px, -14px); }
      71% { transform: translate(71px, -14px); opacity: 1; }
      72%, 100% { transform: translate(71px, -14px); opacity: 0; }
    }
    @keyframes pulse-b {
      0%, 58% { transform: translateX(0); opacity: 0; }
      59% { transform: translateX(0); opacity: 1; }
      73% { transform: translateX(71px); opacity: 1; }
      74%, 100% { transform: translateX(71px); opacity: 0; }
    }
    @keyframes pulse-c {
      0%, 60% { transform: translate(0, 0); opacity: 0; }
      61% { transform: translate(0, 0); opacity: 1; }
      65.5% { transform: translate(24px, 0); }
      69.5% { transform: translate(38px, 14px); }
      75% { transform: translate(71px, 14px); opacity: 1; }
      76%, 100% { transform: translate(71px, 14px); opacity: 0; }
    }
    @keyframes lit-a {
      0%, 71% { opacity: 0; }
      73%, 84% { opacity: 1; }
      90%, 100% { opacity: 0; }
    }
    @keyframes lit-b {
      0%, 73% { opacity: 0; }
      75%, 86% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }
    @keyframes lit-c {
      0%, 75% { opacity: 0; }
      77%, 88% { opacity: 1; }
      94%, 100% { opacity: 0; }
    }
  </style>

  <rect x="0.5" y="0.5" width="1199" height="359" rx="20" fill="#edf0f4" stroke="#cbd2dc"/>
  <rect x="16" y="16" width="1168" height="328" rx="16" fill="url(#surface)" stroke="#cbd2dc"/>
  <g clip-path="url(#panelClip)">
    <rect x="16" y="16" width="1168" height="328" fill="url(#grid)" mask="url(#gridMask)"/>
    <circle cx="674" cy="196" r="170" fill="url(#washSee)"/>
    <circle cx="853" cy="180" r="210" fill="url(#washCarry)"/>
    <circle cx="1032" cy="196" r="170" fill="url(#washTouch)"/>
  </g>
  <rect x="16.5" y="16.5" width="1167" height="327" rx="15.5" fill="none" stroke="url(#edge)" opacity="0.8"/>

  <g transform="translate(54 42)">
    <rect width="46" height="46" rx="12" fill="#ffffff" stroke="#e45738" stroke-width="2"/>
    <text x="23" y="31" fill="#c8452a" font-size="24" font-weight="800" text-anchor="middle">R</text>
    <text x="64" y="18" fill="#18202a" font-size="16" font-weight="700" letter-spacing="3">RONGYI</text>
    <text x="64" y="40" fill="#5f6876" font-size="13" letter-spacing="1.4">INDIE DEVELOPER · FOUNDER OF YI盘</text>
  </g>

  <g font-size="46" font-weight="800" letter-spacing="-1.2">
    <text x="54" y="162" fill="#18202a"><tspan fill="#c8452a">随身</tspan>的上下文，</text>
    <text x="54" y="220" fill="#18202a"><tspan fill="#2559c4">看得见</tspan>的 Agent，</text>
    <text x="54" y="278" fill="#18202a"><tspan fill="#0b7d50">摸得着</tspan>的硬件。</text>
  </g>
  <rect class="underline" x="55" y="172" width="88" height="4" rx="2" fill="#e45738" style="animation-delay: 0.3s"/>
  <rect class="underline" x="55" y="230" width="134" height="4" rx="2" fill="#3d7be0" style="animation-delay: 0.55s"/>
  <rect class="underline" x="55" y="288" width="134" height="4" rx="2" fill="#1aa572" style="animation-delay: 0.8s"/>

  <g id="studio-map">
    <rect id="map-frame" x="560" y="40" width="586" height="280" rx="14" fill="#ffffff" fill-opacity="0.72" stroke="#d5dbe4"/>
    <text x="578" y="62" class="mono" fill="#6c7583" font-size="11" letter-spacing="1.2">RONGYI STUDIO / 三条线示意</text>
    <text x="1128" y="62" fill="#6c7583" font-size="11" text-anchor="end">结构示意 · 非产品截图</text>
    <path d="M560 74H1146" stroke="#d5dbe4"/>

    <g id="zone-see">
      <rect x="578" y="90" width="196" height="212" rx="12" fill="#f8fafc" stroke="#3d7be0" stroke-opacity="0.45"/>
      <text x="594" y="114" fill="#18202a" font-size="14" font-weight="700">AGENT 工具</text>
      <text x="758" y="114" fill="#2559c4" font-size="12" text-anchor="end">可见</text>
      <text x="594" y="138" class="mono" fill="#6c7583" font-size="10" letter-spacing="1">PUBLIC REPOS</text>
      <g fill="#ffffff" stroke="#d5dbe4">
        <rect x="588" y="150" width="176" height="42" rx="8"/>
        <rect x="588" y="198" width="176" height="42" rx="8"/>
        <rect x="588" y="246" width="176" height="42" rx="8"/>
      </g>
      <rect class="activity activity-see" x="588" y="150" width="176" height="42" rx="8" fill="#3d7be0" fill-opacity="0.12" stroke="#3d7be0" stroke-width="1.5"/>
      <g fill="#3d7be0">
        <circle cx="601" cy="163" r="3.5"/>
        <circle cx="601" cy="211" r="3.5"/>
        <circle cx="601" cy="259" r="3.5"/>
      </g>
      <g font-size="13" font-weight="700" fill="#18202a">
        <text x="612" y="167">DSH Usage</text>
        <text x="612" y="215">dsh-spec</text>
        <text x="612" y="263">DevFlow</text>
      </g>
      <g font-size="11" fill="#5f6876">
        <text x="612" y="183">Token · 时长 · 费用</text>
        <text x="612" y="231">规格 · 实现 · 验收</text>
        <text x="612" y="279">窗口焦点 · 本地时间线</text>
      </g>
      <g class="mono" font-size="9" letter-spacing="0.8" fill="#2559c4" text-anchor="end">
        <text x="754" y="167">USAGE</text>
        <text x="754" y="215">SPEC</text>
        <text x="754" y="263">OBSERVE</text>
      </g>
    </g>

    <g id="zone-carry">
      <g class="orbit-a">
        <circle class="orbit" cx="853" cy="180" r="42" fill="none" stroke="#e45738" stroke-opacity="0.45"/>
        <circle cx="823.3" cy="150.3" r="3" fill="#f08a2c"/>
      </g>
      <g class="orbit-b">
        <circle class="orbit" cx="853" cy="180" r="52" fill="none" stroke="#3d7be0" stroke-opacity="0.32"/>
        <circle cx="898" cy="206" r="2.6" fill="#3d7be0"/>
      </g>
      <g class="orbit-c">
        <circle class="orbit" cx="853" cy="180" r="62" fill="none" stroke="#1aa572" stroke-opacity="0.28"/>
        <circle cx="884" cy="126.3" r="2.6" fill="#1aa572"/>
      </g>
      <path class="route" d="M821 180H780" fill="none" stroke="#3d7be0" stroke-width="1.6" marker-end="url(#arrowSee)"/>
      <path class="route" d="M885 180H926" fill="none" stroke="#1aa572" stroke-width="1.6" marker-end="url(#arrowTouch)"/>
      <circle class="core-pulse" cx="853" cy="180" r="32" fill="none" stroke="#e45738" stroke-width="2"/>
      <circle cx="853" cy="180" r="32" fill="url(#coreFill)" stroke="#e45738" stroke-width="1.5"/>
      <text class="core-name" x="853" y="187" fill="#18202a" font-size="20" font-weight="800" text-anchor="middle">YI<tspan fill="#c8452a">盘</tspan></text>
      <text x="853" y="262" fill="#c8452a" font-size="13" font-weight="700" text-anchor="middle">随身</text>
      <text class="mono core-label" x="853" y="280" fill="#6c7583" font-size="10" letter-spacing="1" text-anchor="middle">PORTABLE CONTEXT</text>
    </g>

    <g id="zone-touch">
      <rect x="932" y="90" width="196" height="212" rx="12" fill="#f8fafc" stroke="#1aa572" stroke-opacity="0.45"/>
      <text x="948" y="114" fill="#18202a" font-size="14" font-weight="700">硬件原型</text>
      <text x="1112" y="114" fill="#0b7d50" font-size="12" text-anchor="end">可触</text>
      <rect x="948" y="128" width="164" height="96" rx="8" fill="#f1faf5" stroke="#1aa572" stroke-opacity="0.5"/>
      <path d="M968 152V146M976 152V146M984 152V146M992 152V146M968 200V206M976 200V206M984 200V206M992 200V206" stroke="#1aa572" stroke-opacity="0.55" stroke-width="1.5"/>
      <rect x="960" y="152" width="40" height="48" rx="4" fill="#f8fafc" stroke="#1aa572" stroke-opacity="0.7"/>
      <text x="980" y="180" class="mono" fill="#0b7d50" font-size="9" text-anchor="middle">MCU</text>
      <g fill="none" stroke="#1aa572" stroke-opacity="0.45" stroke-width="1.5">
        <path d="M1000 162H1024L1038 148H1071"/>
        <path d="M1000 176H1071"/>
        <path d="M1000 190H1024L1038 204H1071"/>
      </g>
      <circle cx="1024" cy="162" r="2.2" fill="#1aa572"/>
      <circle cx="1024" cy="190" r="2.2" fill="#1aa572"/>
      <g fill="#cfe9dc" stroke="#1aa572" stroke-opacity="0.5">
        <circle cx="1080" cy="148" r="5"/>
        <circle cx="1080" cy="176" r="5"/>
        <circle cx="1080" cy="204" r="5"/>
      </g>
      <g class="lit lit-a"><circle cx="1080" cy="148" r="13" fill="url(#ledGlow)"/><circle cx="1080" cy="148" r="5" fill="#1aa572"/></g>
      <g class="lit lit-b"><circle cx="1080" cy="176" r="13" fill="url(#ledGlow)"/><circle cx="1080" cy="176" r="5" fill="#1aa572"/></g>
      <g class="lit lit-c"><circle cx="1080" cy="204" r="13" fill="url(#ledGlow)"/><circle cx="1080" cy="204" r="5" fill="#1aa572"/></g>
      <g fill="#1aa572">
        <circle class="packet pulse-a" cx="1000" cy="162" r="2.6"/>
        <circle class="packet pulse-b" cx="1000" cy="176" r="2.6"/>
        <circle class="packet pulse-c" cx="1000" cy="190" r="2.6"/>
      </g>
      <g class="mono" font-size="10" fill="none" stroke="#1aa572" stroke-opacity="0.45">
        <rect x="948" y="238" width="50" height="18" rx="9"/>
        <rect x="1004" y="238" width="50" height="18" rx="9"/>
        <rect x="1060" y="238" width="40" height="18" rx="9"/>
      </g>
      <g class="mono" font-size="10" fill="#0b7d50" text-anchor="middle">
        <text x="973" y="251">ESP32</text>
        <text x="1029" y="251">STM32</text>
        <text x="1080" y="251">RPi</text>
      </g>
      <text x="948" y="284" class="mono" fill="#6c7583" font-size="10" letter-spacing="1">SENSOR → MCU → LED</text>
    </g>

    <g fill="#ffffff" stroke-width="2">
      <circle class="packet packet-see" cx="825" cy="180" r="4" stroke="#3d7be0"/>
      <circle class="packet packet-touch" cx="881" cy="180" r="4" stroke="#1aa572"/>
    </g>
  </g>
</svg>
